  <!-- iOS Safari のスマートアプリバナー（リダイレクトが効かなかった場合の保険） -->
  <meta name="apple-itunes-app" content="app-id=6761193511">

  <script>
    (function () {
      var IOS_URL = "https://apps.apple.com/jp/app/table-shifter/id6761193511";
      var ANDROID_URL = "https://play.google.com/store/apps/details?id=com.localsyncboard.app";
      var ua = navigator.userAgent || "";
      // iPadOS 13 以降は UA が Mac と同じになるため、タッチ対応で判別する
      var isIPadOS = /Macintosh/.test(ua) && navigator.maxTouchPoints > 1;
      if (/android/i.test(ua)) {
        window.location.replace(ANDROID_URL);
      } else if (/iPad|iPhone|iPod/.test(ua) || isIPadOS) {
        window.location.replace(IOS_URL);
      }
    })();
  </script>

  <style>
