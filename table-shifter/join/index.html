<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">

  <title>ルームに参加 | Table Shifter</title>
  <meta name="description" content="Table Shifter のルームに参加します。">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Table Shifter">
  <meta property="og:title" content="Table Shifter のルームに招待されました">
  <meta property="og:description" content="タップしてアプリでルームに参加しましょう。">
  <meta property="og:image" content="https://itsutsukarabo.github.io/table-shifter/ogp-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@itsutsuka_lab">

  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
      background: #152a4a;
      color: #f8fafc;
      text-align: center;
      padding: 48px 16px 64px;
    }
    h1 { font-size: 1.4rem; margin: 0 0 24px; }
    .code {
      display: inline-block;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      background: #f8fafc;
      color: #152a4a;
      padding: 12px 24px;
      border-radius: 10px;
      margin-bottom: 8px;
    }
    .hint { color: #cbd5e1; font-size: 0.9rem; margin: 0 0 32px; }
    .btn {
      display: block;
      max-width: 320px;
      margin: 0 auto 12px;
      padding: 14px 20px;
      border-radius: 10px;
      font-weight: 700;
      text-decoration: none;
    }
    .btn-primary { background: #86efac; color: #152a4a; }
    .btn-secondary { background: transparent; color: #f8fafc; border: 1px solid #64748b; }
    .error { color: #fca5a5; }
    [hidden] { display: none !important; }
    .trademark { color: #94a3b8; font-size: 0.75rem; margin: 48px 0 0; }
  </style>
</head>
<body>
  <main id="valid" hidden>
    <h1>ルームに参加</h1>
    <div class="code" id="code"></div>
    <p class="hint">アプリが開かない場合は、アプリの「ルームに参加」でこのコードを入力してください。</p>
    <a class="btn btn-primary" id="open-app" href="#">アプリで開く</a>
    <a class="btn btn-secondary" id="store" href="#">アプリをダウンロード</a>
  </main>

  <main id="invalid" hidden>
    <h1 class="error">ルームコードが正しくありません</h1>
    <p class="hint">QR コードをもう一度読み取ってください。</p>
    <a class="btn btn-secondary" href="../">Table Shifter について</a>
  </main>

  <footer>
    <p class="trademark">「QRコード」は株式会社デンソーウェーブの登録商標です。</p>
  </footer>

  <script>
    (function () {
      var IOS_STORE = "https://apps.apple.com/jp/app/table-shifter/id6761193511";
      var ANDROID_STORE = "https://play.google.com/store/apps/details?id=com.localsyncboard.app";
      var ANDROID_PACKAGE = "com.localsyncboard.app";
      var SCHEME = "localsyncboard";

      var match = location.search.match(/[?&]code=([A-Za-z0-9]{6})(?:&|$)/);
      if (!match) {
        document.getElementById("invalid").hidden = false;
        return;
      }
      var code = match[1].toUpperCase();

      var ua = navigator.userAgent || "";
      var isAndroid = /android/i.test(ua);
      // iPadOS 13 以降は UA が Mac と同じになるため、タッチ対応で判別する
      var isIOS = /iPad|iPhone|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);

      var schemeUrl = SCHEME + "://join?code=" + code;
      // Android はインテント URL にするとアプリ未インストール時にストアへ自動で切り替わる
      var appUrl = isAndroid
        ? "intent://join?code=" + code + "#Intent;scheme=" + SCHEME + ";package=" + ANDROID_PACKAGE +
          ";S.browser_fallback_url=" + encodeURIComponent(ANDROID_STORE) + ";end"
        : schemeUrl;

      document.getElementById("code").textContent = code;
      document.getElementById("open-app").href = appUrl;
      var store = document.getElementById("store");
      if (isAndroid) {
        store.href = ANDROID_STORE;
      } else if (isIOS) {
        store.href = IOS_STORE;
      } else {
        store.href = "../";
        document.getElementById("open-app").hidden = true;
      }
      document.getElementById("valid").hidden = false;

      if (isAndroid || isIOS) {
        location.href = appUrl;
      }
    })();
  </script>
</body>
</html>
